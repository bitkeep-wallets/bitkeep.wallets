<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewards Hub UI</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0e11; /* Latar belakang gelap utama */
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Container untuk tampilan Mobile */
        .app-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Top Bar (Header) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Area Ilustrasi Koin (Simulasi dengan CSS) */
        .illustration-area {
            position: relative;
            height: 250px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Membuat pola titik-titik di background */
        .illustration-area::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(#1c2126 1.5px, transparent 1.5px);
            background-size: 12px 12px;
            z-index: 0;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        /* Simulasi Lingkaran Koin */
        .coin {
            position: absolute;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            z-index: 1;
        }

        /* Posisi dan warna koin (dibuat abstrak menyerupai gambar) */
        .coin-btc { width: 140px; height: 140px; background: #f7931a; color: #000; top: 60px; left: 10px; border: 8px solid #1a1e23; font-size: 60px; }
        .coin-usdt { width: 70px; height: 70px; background: #26a17b; color: #fff; top: 10px; right: 80px; border: 5px solid #1a1e23;}
        .coin-uni { width: 80px; height: 80px; background: #ff007a; color: #fff; top: 30px; left: 100px; border: 5px solid #1a1e23;}
        .coin-sol { width: 70px; height: 70px; background: #000; color: #14f195; top: 90px; right: 40px; border: 5px solid #1a1e23;}
        .coin-doge { width: 80px; height: 80px; background: #c2a633; color: #fff; top: 110px; left: 140px; border: 5px solid #1a1e23; font-size: 30px;}
        .coin-arb { width: 110px; height: 110px; background: #28a0f0; color: #fff; top: 80px; right: -20px; border: 6px solid #1a1e23;}
        .coin-eth { width: 60px; height: 60px; background: #627eea; color: #fff; bottom: 10px; right: 30px; border: 5px solid #1a1e23;}
        .coin-green { width: 70px; height: 70px; background: #00d16c; color: #fff; top: 10px; left: 10px; border: 5px solid #1a1e23;}
        
        /* Ikon-ikon kecil lainnya disimulasikan dengan warna solid */
        .coin-pill { width: 60px; height: 60px; background: #1e2329; color: #00d16c; bottom: 40px; left: 130px; font-size: 20px;}
        .coin-pepe { width: 70px; height: 70px; background: #4caf50; color: #fff; bottom: 20px; left: 200px; font-size: 30px; border: 5px solid #1a1e23;}

        /* Bagian Teks */
        .text-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .text-section h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .text-section p {
            color: #848e9c;
            font-size: 14px;
        }

        /* Notifikasi Live (Ticker) */
        .live-ticker {
            background-color: #181a20;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 12px;
            color: #b7bdc6;
            text-align: center;
            margin: 0 auto 20px auto;
            width: fit-content;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: pulse 2s infinite;
        }

        .live-ticker span {
            color: #eaecef;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        /* Kotak Cara Berpartisipasi (Ways to participate) */
        .participation-card {
            background-color: #181a20;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .participation-card h2 {
            font-size: 14px;
            font-weight: 500;
            color: #eaecef;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .grid-item {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        /* Ikon di dalam kotak */
        .icon-wrapper {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #2b3139; /* Warna background ikon */
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00d16c; /* Warna ikon hijau/biru muda */
        }
        
        /* Variasi warna ikon */
        .icon-blue { color: #28a0f0; }
        
        .icon-wrapper svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .grid-item span {
            font-size: 14px;
            color: #eaecef;
        }

        /* Navigasi Bawah */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            margin-top: auto; /* Mendorong ke bawah */
            border-top: 1px solid #181a20;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            fill: #848e9c;
            cursor: pointer;
        }

        .nav-icon.active {
            fill: #ffffff;
        }
        
        /* Simulasi shape icon khusus */
        .shape-icon {
            width: 20px;
            height: 20px;
            border: 2px solid #848e9c;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <header class="top-bar">
            <!-- Icon Back -->
            <button class="icon-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <!-- Icon Question Mark -->
            <button class="icon-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </button>
        </header>

        <!-- Area Ilustrasi -->
        <section class="illustration-area">
            <!-- Koin-koin (Menggunakan teks sebagai placeholder ikon) -->
            <div class="coin coin-btc">₿</div>
            <div class="coin coin-usdt">₮</div>
            <div class="coin coin-uni">🦄</div>
            <div class="coin coin-sol">≡</div>
            <div class="coin coin-doge">Ð</div>
            <div class="coin coin-arb">A</div>
            <div class="coin coin-eth">♦</div>
            <div class="coin coin-green">M</div>
            <div class="coin coin-pill">💊</div>
            <div class="coin coin-pepe">🐸</div>
        </section>

        <!-- Teks Utama -->
        <section class="text-section">
            <h1>Rewards Hub</h1>
            <p>Join official events and win nonstop!</p>
        </section>

        <!-- Notifikasi Live -->
        <div class="live-ticker">
            0xfa****5a18 just received 0.12972043 RLUSD
        </div>

        <!-- Card Cara Partisipasi -->
        <section class="participation-card">
            <h2>Ways to participate</h2>
            <div class="grid-container">
                
                <div class="grid-item">
                    <div class="icon-wrapper icon-blue">
                        <!-- Trade Icon -->
                        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                    </div>
                    <span>Trade</span>
                </div>

                <div class="grid-item" onclik="alert('Anda akan diarahkan ke halaman Permainan!');">
                    <div class="icon-wrapper icon-blue">
                        <!-- Play Icon -->
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <span>Play</span>
                </div>

                <div class="grid-item">
                    <div class="icon-wrapper icon-blue">
                        <!-- Stake Icon (Simulasi) -->
                        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <span>Stake</span>
                </div>

                <div class="grid-item">
                    <div class="icon-wrapper icon-blue">
                        <!-- Interact Icon (Smiley) -->
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14c-1.66 0-3-1.34-3-3h2c0 .55.45 1 1 1s1-.45 1-1h2c0 1.66-1.34 3-3 3zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
                    </div>
                    <span>Interact</span>
                </div>

            </div>
        </section>

        <!-- Navigasi Bawah -->
        <nav class="bottom-nav">
            <!-- Menu Hamburger -->
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            <!-- Home -->
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <!-- Arrow Right (Simulasi) -->
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            <!-- User/Person -->
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </nav>

    </div>

</body>
</html>
